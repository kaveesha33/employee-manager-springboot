<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Edit Employee')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>

<main class="container page-content narrow-content">
    <div class="page-heading">
        <div>
            <p class="eyebrow">EMPLOYEE RECORD</p>
            <h1>Edit employee</h1>
            <p class="subheading">Update the fields and save your changes.</p>
        </div>
    </div>

    <section class="panel">
        <form th:action="@{/employees/{id}/update(id=${employee.id})}" th:object="${employee}" method="post" class="employee-form">
            <div class="form-grid">
                <div class="form-field">
                    <label for="fullName">Full name</label>
                    <input id="fullName" type="text" th:field="*{fullName}" required>
                    <small class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></small>
                </div>
                <div class="form-field">
                    <label for="email">Email</label>
                    <input id="email" type="email" th:field="*{email}" required>
                    <small class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>
                </div>
                <div class="form-field">
                    <label for="phone">Phone</label>
                    <input id="phone" type="tel" th:field="*{phone}" pattern="07[0-9]{8}" required>
                    <small class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></small>
                </div>
                <div class="form-field">
                    <label for="department">Department</label>
                    <input id="department" type="text" th:field="*{department}" required>
                    <small class="field-error" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></small>
                </div>
                <div class="form-field">
                    <label for="salary">Monthly salary (LKR)</label>
                    <input id="salary" type="number" min="0.01" step="0.01" th:field="*{salary}" required>
                    <small class="field-error" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></small>
                </div>
            </div>
            <div class="button-row">
                <button class="button primary" type="submit">Update Employee</button>
                <a class="button secondary" th:href="@{/employees}">Cancel</a>
            </div>
        </form>
    </section>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
